services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - ../../Projects:/projects
    environment:
      - NODE_ENV=development
      - SONGWRITER_PROJECTS_ROOT=/projects
    stdin_open: true
    tty: true

